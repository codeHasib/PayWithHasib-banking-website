<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>PayWithHasib</title>
  </head>
  <body>
    <!-- User Info Interface -->
    <section id="user-info" class="text-center h-[100vh] w-[100vw]">
      <div
        class="bg-[url(/assets/user-info-bg.png)] bg-no-repeat bg-contain bg-center h-[55vh] mb-10"
      >
        <div class="flex items-center justify-center">
          <img
            src="./assets/logo.svg"
            alt="Logo of PayWithHasib"
            class="logo"
          />
          <h2 class="text-3xl font-extrabold">PayWithHasib</h2>
        </div>
      </div>
      <div class="space-y-5">
        <h1 class="text-4xl font-bold">Online based Banking</h1>
        <h2 class="text-2xl">Hey there please provide your info to continue</h2>
        <div
          id="user-info-inputs"
          class="flex flex-col items-center justify-center gap-5"
        >
          <div>
            <p class="name-msg text-red-500"></p>
            <input
              type="text"
              class="user-name"
              placeholder="Enter Your Name"
            />
          </div>
          <div>
            <p class="amount-msg text-red-500"></p>
            <input
              type="number"
              class="user-amount"
              placeholder="Enter Your Amount"
            />
          </div>
          <button
            class="user-info-submit bg-black py-3 px-8 rounded-2xl font-bold text-white text-2xl"
          >
            Submit
          </button>
        </div>
      </div>
    </section>
    <!-- User Info Interface is done -->

    <header class="app py-3 px-5 max-w-[1200px] m-auto bg-[#f9efe5]">
      <div class="flex items-center">
        <img
          src="./assets/logo.svg"
          alt="Logo of PayWithHasib"
          class="w-[100px]"
        />
        <h2 class="text-2xl font-extrabold">PayWithHasib</h2>
      </div>
      <div class="flex justify-between">
        <h2 class="userNameDisplay text-2xl font-bold"></h2>
        <h2 class="userAmountDisplay text-2xl font-bold"></h2>
      </div>
    </header>

    <section id="transactions" class="app bg-black text-white mt-7">
      <div class="flex items-center flex-wrap justify-around">
        <div class="transaction deposit">
          <i class="fa-regular fa-square-plus"></i>
          <h3>Deposit</h3>
        </div>
        <div class="transaction send">
          <i class="fa-regular fa-paper-plane"></i>
          <h3>Send</h3>
        </div>
        <div class="transaction withdraw">
          <i class="fa-regular fa-square-minus"></i>
          <h3>Withdraw</h3>
        </div>
      </div>
    </section>

    <section id="hero" class="app ">
        <img src="./assets/hero.png" class="block mt-10 w-[100%]" alt="Banner Image About PayWithHasib">
    </section>

    <section id="history" class="app">
        <h2 class="text-2xl text-center font-bold mb-10 underline">
            Transaction history
        </h2>
        <div class="historyDiv bg-amber-100 rounded-2xl p-5">
        </div>
    </section>

    <!-- Deposit page -->
    <section id="depositPage" class="transaction-pages">
      <div
        class="transaction-page-heading bg-[url(/assets/deposit.png)] bg-no-repeat bg-center bg-contain"
      >
        <div class="flex">
          <i class="fa-solid fa-angle-left back-btn"></i>
          <h2>Deposit Money</h2>
        </div>
        <h2 class="userAmountDisplay"></h2>
      </div>
      <div class="transaction-page-input">
        <p class="depoWarnMsg text-red-500 font-bold"></p>
        <input class="depositInput" type="number" placeholder="Enter Amount" />
        <button class="depositBtn">Deposit</button>
      </div>
    </section>

    <!-- Send Money Page -->
    <section id="sendMoneyPage" class="transaction-pages">
      <div
        class="transaction-page-heading bg-[url(/assets/sendmoney.png)] bg-no-repeat bg-center bg-contain"
      >
        <div class="flex">
          <i class="fa-solid fa-angle-left back-btn"></i>
          <h2>Send Money</h2>
        </div>
        <h2 class="userAmountDisplay"></h2>
      </div>
      <div class="transaction-page-input">
        <p class="sendWarnMsg text-red-500 font-bold"></p>
        <input type="number" class="sendMoneyInput" placeholder="Enter Amount" />
        <button class="sendMoneyBtn">Send</button>
      </div>
    </section>

    <!-- Withdraw Page -->
    <section id="withdrawPage" class="transaction-pages">
      <div
        class="transaction-page-heading bg-[url(/assets/withdraw.png)] bg-no-repeat bg-center bg-contain"
      >
        <div class="flex">
          <i class="fa-solid fa-angle-left back-btn"></i>
          <h2>Withdraw Money</h2>
        </div>
        <h2 class="userAmountDisplay"></h2>
      </div>
      <div class="transaction-page-input">
        <p class="withWarnMsg text-red-500 font-bold"></p>
        <input type="number" placeholder="Enter Amount" class="withdrawInput"/>
        <button class="withdrawBtn">Withdraw</button>
      </div>
    </section>

    <script src="./script/script.js"></script>
  </body>
</html>
