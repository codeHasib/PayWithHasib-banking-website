<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>PayWithHasib</title>
  </head>
  <body>
    <!-- User Info Interface -->
    <section id="user-info" class="text-center min-h-[100vh] w-[100%]">
      <div
        class="bg-[url(./assets/user-info-bg.webp)] bg-no-repeat bg-contain bg-center h-[40vh] mb-5"
      >
        <div class="flex items-center justify-center">
          <img
            src="./assets/logo.svg"
            alt="Logo of PayWithHasib"
            class="logo"
          />
          <h2 class="text-3xl font-extrabold">PayWithHasib</h2>
        </div>
      </div>
      <div class="space-y-2">
        <h1 class="text-2xl md:text-4xl lg:text-4xl font-extrabold">
          Online based Banking
        </h1>
        <h2 class="text-xl md:text-2xl lg:text-2xl">
          Hey there please provide your info to continue
        </h2>
        <div
          id="user-info-inputs"
          class="flex flex-col items-center justify-center gap-3"
        >
          <div>
            <div class="flex flex-col gap-1 items-center">
              <p class="name-msg text-red-500 font-bold"></p>
              <label for="user-name" class="font-bold ml-1">Username:</label>
              <input
                type="text"
                id="user-name"
                class="user-name"
                placeholder="Enter Your Name"
              />
            </div>
          </div>
          <div class="flex flex-col gap-1 items-center">
            <p class="pin-msg text-red-500 font-bold"></p>
            <label for="user-pin" class="font-bold ml-1">Pin:</label>
            <input
              type="number"
              id="user-pin"
              class="user-pin"
              placeholder="Enter Your 4-Digit Pin"
            />
          </div>
          <div>
            <div class="flex flex-col gap-1 items-center">
              <p class="amount-msg text-red-500 font-bold"></p>
              <label for="user-amount" class="font-bold ml-1">Amount:</label>
              <input
                type="number"
                id="user-amount"
                class="user-amount"
                placeholder="Enter Your Amount"
              />
            </div>
          </div>
          <button
            class="user-info-submit bg-black py-3 px-8 rounded-2xl font-bold text-white lg:text-2xl md:text-2xl"
          >
            Submit
          </button>
        </div>
      </div>
    </section>
    <!-- User Info Interface is done -->

    <header class="app py-3 px-5 max-w-[1200px] m-auto bg-[#f9efe5]">
      <div class="flex items-center">
        <img
          src="./assets/logo.svg"
          alt="Logo of PayWithHasib"
          class="w-[100px]"
        />
        <h2 class="text-2xl font-extrabold">PayWithHasib</h2>
      </div>
      <div class="flex justify-between">
        <h2 class="userNameDisplay text-2xl font-bold"></h2>
        <h2 class="userAmountDisplay text-2xl font-bold"></h2>
      </div>
    </header>

    <section id="transactions" class="app bg-black text-white mt-7">
      <div class="flex items-center flex-wrap justify-around">
        <div class="transaction deposit">
          <i class="fa-regular fa-square-plus"></i>
          <h3>Deposit</h3>
        </div>
        <div class="transaction send">
          <i class="fa-regular fa-paper-plane"></i>
          <h3>Send</h3>
        </div>
        <div class="transaction withdraw">
          <i class="fa-regular fa-square-minus"></i>
          <h3>Withdraw</h3>
        </div>
      </div>
    </section>

    <section id="hero" class="app">
      <img
        src="./assets/hero.webp"
        class="block mt-10 w-[100%]"
        alt="Banner Image About PayWithHasib"
      />
    </section>


    <section id="history" class="app">
      <h2 class="text-2xl text-center font-bold mb-10 underline">
        Transaction history
      </h2>
      <div class="searchHistory flex items-center justify-center mb-5 px-3 bg-black text-white w-[300px] mx-auto py-1 h-[60px] gap-4 rounded-4xl">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="searchInput" class="w-full h-full outline-none placeholder:font-bold" placeholder="Search here">
      </div>
      <div class="historyDiv bg-amber-100 rounded-2xl p-5"></div>
    </section>

    <!-- Deposit page -->
    <section id="depositPage" class="transaction-pages">
      <div
        class="transaction-page-heading bg-[url(./assets/deposit.webp)] bg-no-repeat bg-center bg-contain"
      >
        <div class="flex">
          <i class="fa-solid fa-angle-left back-btn"></i>
          <h2>Deposit Money</h2>
        </div>
        <h2 class="userAmountDisplay"></h2>
      </div>
      <div class="transaction-page-input">
        <p class="depoWarnMsg text-red-500 font-bold"></p>
        <input class="depositInput" type="number" placeholder="Enter Amount" />
        <input class="depoPinInput" type="number" placeholder="Enter Pin" />
        <select id="depositMethod">
          <option value="default" selected disabled>Select Your Deposit Method</option>
          <option value="card">Card</option>
          <option value="bank">Bank</option>
          <option value="cash">Cash</option>
        </select>
        <button class="depositBtn">Deposit</button>
      </div>
    </section>

    <!-- Send Money Page -->
    <section id="sendMoneyPage" class="transaction-pages">
      <div
        class="transaction-page-heading bg-[url(./assets/sendmoney.webp)] bg-no-repeat bg-center bg-contain"
      >
        <div class="flex">
          <i class="fa-solid fa-angle-left back-btn"></i>
          <h2>Send Money</h2>
        </div>
        <h2 class="userAmountDisplay"></h2>
      </div>
      <div class="transaction-page-input">
        <p class="sendWarnMsg text-red-500 font-bold"></p>
        <input
          type="number"
          class="sendMoneyInput"
          placeholder="Enter Amount"
        />
        <input class="sendAccNum" type="number" placeholder="Enter Account Number" />
        <input class="sendPinInput" type="number" placeholder="Enter Pin" />
        <button class="sendMoneyBtn">Send</button>
      </div>
    </section>

    <!-- Withdraw Page -->
    <section id="withdrawPage" class="transaction-pages">
      <div
        class="transaction-page-heading bg-[url(./assets/withdraw.webp)] bg-no-repeat bg-center bg-contain"
      >
        <div class="flex">
          <i class="fa-solid fa-angle-left back-btn"></i>
          <h2>Withdraw Money</h2>
        </div>
        <h2 class="userAmountDisplay"></h2>
      </div>
      <div class="transaction-page-input">
        <p class="withWarnMsg text-red-500 font-bold"></p>
        <input type="number" placeholder="Enter Amount" class="withdrawInput" />
        <input class="withPinInput" type="number" placeholder="Enter Pin" />
        <button class="withdrawBtn">Withdraw</button>
      </div>
    </section>

    <section
      id="successfulTransPopUp"
      class="flex flex-wrap min-h-[100vh] min-w-[100vw] z-10 top-0 left-0 right-0 bottom-0 fixed items-center justify-center backdrop-blur-xl"
    >
      <div
        class="popUp-div lg:w-[50%] md:w-[50%] min-h-[50%] w-[95%] border rounded-4xl bg-black text-white relative flex items-center justify-center flex-col gap-4"
      >
        <div class="absolute top-2 left-3 text-3xl cursor-pointer">
          <i class="fa-regular fa-circle-xmark close-popup"></i>
        </div>
        <div>
          <i class="fa-solid fa-circle-check text-green-400 text-4xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-center">
          <span class="methodType"></span> is successful!
        </h2>
        <h3 class="text-xl font-semibold">
          Remaining balance: $<span class="remainingMoney"></span>
        </h3>
        <div class="flex gap-5 items-center justify-center flex-wrap">
          <div
            class="popUp-homeBtn min-w-[40%] bg-green-500 p-5 rounded-2xl text-xl font-semibold text-center cursor-pointer"
          >
            <h2>Back To Home</h2>
          </div>
          <div
            class="popUp-againBtn min-w-[40%] bg-green-500 p-5 rounded-2xl text-xl font-semibold text-center cursor-pointer"
          >
            <h2>
              <span class="methodType"></span>
              Again
            </h2>
          </div>
        </div>
      </div>
    </section>

    <script src="./script/script.js"></script>
  </body>
</html>
