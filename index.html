<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>PayWithHasib</title>
  </head>
  <body>
    <!-- User Info Interface -->
    <section id="user-info" class="text-center bg-amber-50 h-[100vh] w-[100vw]">
      <div
        class="bg-[url(/assets/user-info-bg.png)] bg-no-repeat bg-cover bg-center h-[55vh]"
      >
        <div class="flex items-center">
          <img
            src="./assets/logo.png"
            alt="Logo of PayWithHasib"
            class="logo"
          />
          <h2 class="text-3xl font-extrabold">PayWithHasib</h2>
        </div>
      </div>
      <div class="space-y-5">
        <h1 class="text-4xl font-bold">Online based Banking</h1>
        <h2 class="text-2xl">Hey there please provide your info to continue</h2>
        <div
          id="user-info-inputs"
          class="flex flex-col items-center justify-center gap-5"
        >
          <div>
            <p class="name-msg text-red-500"></p>
            <input
              type="text"
              class="user-name"
              placeholder="Enter Your Name"
            />
          </div>
          <div>
            <p class="amount-msg text-red-500"></p>
            <input
              type="number"
              class="user-amount"
              placeholder="Enter Your Amount"
            />
          </div>
          <button
            class="user-info-submit bg-black py-3 px-8 rounded-2xl font-bold text-white text-2xl"
          >
            Submit
          </button>
        </div>
      </div>
    </section>
    <!-- User Info Interface is done -->

    
    <script src="./script/script.js"></script>
  </body>
</html>
